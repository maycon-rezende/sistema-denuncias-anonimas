<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>

<body>

    <div class="erro-pagina__codigo">404</div>
    <h1>Página não encontrada</h1>

</html>
